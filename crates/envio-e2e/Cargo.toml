[package]
name = "envio-e2e"
description = "Cross-crate tests of envio; no library code"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
envio-core = { path = "../envio-core" }

[dev-dependencies]
envio-core = { path = "../envio-core", features = ["test-hooks"] }
envio-mime = { path = "../envio-mime" }
envio-net = { path = "../envio-net" }
envio-store = { path = "../envio-store" }
envio-sync = { path = "../envio-sync" }
futures = "0.3"
log = "0.4"
serde_json = "1"
secrecy = "0.10"
tempfile = "3"
tokio = { version = "1.54", features = ["macros", "rt"] }
rcgen = "0.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
