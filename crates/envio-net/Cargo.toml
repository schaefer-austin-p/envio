[package]
name = "envio-net"
description = "Envio's network side: IMAP, SMTP, account autoconfig and TLS with pinned certificates"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23"
futures = "0.3"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "tokio1"] }
quick-xml = "0.42"
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["net", "time", "io-util", "rt"] }
webpki-roots = "1"
zeroize = "1"
rcgen = { version = "0.14", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
log = "0.4"
rcgen = "0.14"
# Turns on `test-mock` for this crate's own tests, so plain `cargo test` runs
# the graph tests that need it (no per-command --features).
envio-net = { path = ".", features = ["test-mock"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync"] }

[features]
# `graph::mock`: a scripted TLS server for Graph tests, here and in
# envio-sync and envio-core (dev-dependency with this feature).
test-mock = ["dep:rcgen", "tokio/rt-multi-thread", "tokio/sync"]

[[test]]
name = "graph_http"
required-features = ["test-mock"]
