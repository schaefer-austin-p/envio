[package]
name = "envio-net"
description = "Envio's network side: IMAP, SMTP, account autoconfig and TLS with pinned certificates"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1"] }
quick-xml = "0.42"
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
secrecy = "0.10"
thiserror = "2"
tokio = { version = "1.54", features = ["net", "time", "io-util", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync"] }
