[package]
name = "envio-mime"
description = "Envio's mail formats: parse, render to Qt rich text, build, reply and forward"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ammonia = "4.2"
getrandom = "0.4"
mail-builder = { version = "2.0", default-features = false }
mail-parser = { version = "0.11.9", features = ["full_encoding"] }

[dev-dependencies]
insta = "1.49"
