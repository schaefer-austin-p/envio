[config]
default_to_workspace = false

[env]
# The app job's image: clickable's amd64 UT 24.04 image plus CI tools
# (infrastructure repo, docker/ut-app-ci).
APP_CI_IMAGE = { value = "code.austinschaefer.com/schaefera/ut-app-ci:24.04-2.x-1", condition = { env_not_set = ["APP_CI_IMAGE"] } }

[tasks.format]
command = "cargo"
args = ["fmt", "--all"]

[tasks.format-check]
command = "cargo"
args = ["fmt", "--all", "--check"]

# The Qt-free workspace; qt/ is linted by app-docker.
[tasks.lint]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[tasks.test]
command = "cargo"
args = ["test", "--workspace"]

# What CI's PR run would test.
[tasks.affected]
command = "cargo"
args = ["xtask", "affected", "--base", "origin/master"]

# Named coverage-report: cargo-make reserves "coverage".
[tasks.coverage-report]
command = "cargo"
args = ["llvm-cov", "--workspace", "--summary-only"]

[tasks.audit]
clear = true
script = '''
cargo audit
cargo audit --file qt/Cargo.lock
'''

[tasks.pot]
description = "Regenerate po/envio.aps.pot after changing strings"
command = "tools/i18n/update.sh"

[tasks.app-docker]
description = "The app checks and build, as CI runs them"
# Runs as the calling user so build-docker/ and target/ stay removable; the
# image's CARGO_HOME is root-owned, so crates download into target/ instead.
# The stamp (#198) is taken on the host: a worktree's gitdir isn't mounted.
script = '''
docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
  -e ENVIO_GIT="$(sh tools/stamp.sh)" \
  -v "${CARGO_MAKE_WORKING_DIRECTORY}:/src" -w /src \
  -e CARGO_HOME=/src/target/docker-cargo \
  -e BUILD_DIR=/src/build-docker -e CARGO_TARGET_DIR=/src/target/docker-qt \
  "${APP_CI_IMAGE}" tools/ci/app.sh
'''

[tasks.net-it]
description = "envio-net's tests (the same Stalwart serves envio-e2e's, see e2e-it) against a throwaway Stalwart in local Docker"
script = '''
set -eu
# Removed on exit, whatever the tests did; a failed start fails the task.
# A name of its own: up.sh replaces a container of the same name, so two
# runs (two worktrees) would kill each other's Stalwart and share its users
# and its send limit of 25 messages an hour per user (#257).
STALWART_NAME="${STALWART_NAME:-envio-stalwart-$$}"
export STALWART_NAME
# Labels the container with this run so a later run can reap it if this one is killed.
STALWART_OWNER_PID=$$
export STALWART_OWNER_PID
trap 'docker rm -f "$STALWART_NAME" >/dev/null 2>&1 || true' EXIT
settings=$(crates/envio-net/tests/stalwart/up.sh)
eval "$settings"
ENVIO_REQUIRE_STALWART=1 cargo test -p envio-net
'''

[tasks.e2e-it]
description = "envio-e2e's tests (sync over net into store) against a throwaway Stalwart in local Docker"
script = '''
set -eu
# A name of its own: up.sh replaces a container of the same name, so two
# runs (two worktrees) would kill each other's Stalwart and share its users
# and its send limit of 25 messages an hour per user (#257).
STALWART_NAME="${STALWART_NAME:-envio-stalwart-$$}"
export STALWART_NAME
STALWART_OWNER_PID=$$
export STALWART_OWNER_PID
trap 'docker rm -f "$STALWART_NAME" >/dev/null 2>&1 || true' EXIT
settings=$(crates/envio-net/tests/stalwart/up.sh)
eval "$settings"
ENVIO_REQUIRE_STALWART=1 cargo test -p envio-e2e
'''

# QML never formats a count (#3); the script also checks itself on a fixture.
[tasks.no-qml-plurals]
command = "tools/ci/no-qml-plurals.sh"
args = ["--self-test"]

# The app's Config takes its OAuth providers from envio-core (#219).
[tasks.oauth-wired]
command = "tools/ci/oauth-wired.sh"
args = ["--self-test"]

# Needs the qml/bindle submodule (git submodule update --init).
[tasks.bindle-qrc]
description = "bindle.qrc lists every bindle QML file (#229)"
command = "cargo"
args = ["xtask", "bindle-qrc"]

[tasks.app-qrc]
description = "qml.qrc lists every app QML file (#125)"
command = "cargo"
args = ["xtask", "app-qrc"]

[tasks.ci]
dependencies = ["format-check", "lint", "coverage-report", "audit", "no-qml-plurals", "oauth-wired", "bindle-qrc", "app-qrc"]

[tasks.default]
alias = "ci"

# The phone package, cross-compiled in clickable's Docker image. A
# development build: its stamp (tools/stamp.sh, #198) is taken here, where
# the worktree's git is, and clickable passes it into its container.
# ENVIO_RELEASE=1 is passed on too, or a release built this way would be
# stamped (the official one is click.yml's tag build).
[tasks.click]
description = "Build the arm64 .click for the phone"
script = '''
CLICKABLE_ENV_ENVIO_RELEASE="${ENVIO_RELEASE:-}" CLICKABLE_ENV_ENVIO_GIT="$(sh tools/stamp.sh)" \
  clickable build --arch arm64
'''

[tasks.click-install]
description = "Build, install on the phone over adb, and launch"
dependencies = ["click"]
script = '''
clickable install --arch arm64
clickable launch --arch arm64
'''

[tasks.qml-test]
description = "Run the QML tests in the CI image (builds the Envio module for them)"
# Same mounts and build dirs as app-docker, so the two share one build.
script = '''
docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
  -e ENVIO_GIT="$(sh tools/stamp.sh)" \
  -v "${CARGO_MAKE_WORKING_DIRECTORY}:/src" -w /src \
  -e CARGO_HOME=/src/target/docker-cargo \
  -e BUILD_DIR=/src/build-docker -e CARGO_TARGET_DIR=/src/target/docker-qt \
  "${APP_CI_IMAGE}" tests/qml/run.sh
'''

# The app on this machine's own Qt 5.15, no click and no container (#188).
# Needs git, cmake, gettext (msgfmt), a C++ toolchain and the Qt 5.15 base,
# declarative and quickcontrols2 dev packages. Data and cache go to
# build/desktop/dev-data and dev-cache, never the real ~/.local/share/envio.aps
# (a branch build would sync, send and migrate the real accounts); set
# ENVIO_REAL_DATA=1 to use the XDG folders deliberately. Arguments after `--`
# go to the app (a mailto: link). The window is the phone's 360x640.
[tasks.run-desktop]
description = "Build the app natively for this x86_64 desktop and start it"
script = '''
set -eu
export ENVIO_GIT="$(sh tools/stamp.sh)"
build="${BUILD_DIR:-build/desktop}"
cmake -S . -B "$build" -DCMAKE_BUILD_TYPE=Release
cmake --build "$build" -j "$(nproc)"
if [ "${ENVIO_REAL_DATA:-}" != 1 ]; then
  root=$(cd "$build" && pwd)
  mkdir -p "$root/dev-data" "$root/dev-cache"
  export XDG_DATA_HOME="$root/dev-data" XDG_CACHE_HOME="$root/dev-cache"
fi
echo "envio data: ${XDG_DATA_HOME:-~/.local/share}/envio.aps"
exec "$build/envio" "$@"
'''
