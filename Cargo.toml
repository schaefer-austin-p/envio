[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"
authors = ["Austin Schaefer <austin.schaefer@mailo.eu>"]

[workspace.lints.rust]
# The core is plain Rust; the only unsafe in the app is the cxx-qt bridge
# in qt/, which is its own workspace.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Nursery-tier, so opt-in; see clippy.toml for why this over literal
# cyclomatic complexity.
cognitive_complexity = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
