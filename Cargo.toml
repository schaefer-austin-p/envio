[package]
name = "envio"
version = "0.1.0"
authors = ["Austin Schaefer <austin.schaefer@mailo.eu>"]
edition = "2024"

build = "build.rs"

[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"
authors = ["Austin Schaefer <austin.schaefer@mailo.eu>"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Nursery-tier, so opt-in; see clippy.toml for why this over literal
# cyclomatic complexity.
cognitive_complexity = "warn"

[lints]
workspace = true

# The app is Qt glue with no unit tests (its logic is in passcore, and the
# glue is exercised on the device), so don't build a test harness for it:
# that would link Qt just to run nothing. Clippy still lints it.
[[bin]]
name = "envio"
path = "src/main.rs"
test = false

[dependencies]
envio-core = { path = "crates/envio-core" }
qmetaobject = "0.2.9"
# glibc has gettext built in; without this, gettext-sys builds GNU gettext
# from source (./configure && make, ~8 min per profile in CI, uncacheable)
gettext-rs = { version = "0.7", features = ["gettext-system"] }
cstr = "0.2.11"
cpp = "0.5.11"

[build-dependencies]
cpp_build = "0.5.11"
walkdir = "2.5"
