<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Envio</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6cd96"/>
      <stop offset="0.15" stop-color="#f6e8c4"/>
      <stop offset="0.85" stop-color="#f3e2b8"/>
      <stop offset="1" stop-color="#dcc086"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99f5c"/>
      <stop offset="0.35" stop-color="#f4e3b8"/>
      <stop offset="0.7" stop-color="#ddbe82"/>
      <stop offset="1" stop-color="#a87d40"/>
    </linearGradient>
    <radialGradient id="wax" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#e2453f"/>
      <stop offset="0.55" stop-color="#b3201f"/>
      <stop offset="1" stop-color="#6e0d10"/>
    </radialGradient>
    <radialGradient id="waxInner" cx="0.6" cy="0.65" r="0.7">
      <stop offset="0" stop-color="#c62a26"/>
      <stop offset="1" stop-color="#8f1517"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1015"/>
      <stop offset="1" stop-color="#a51d22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3b2208" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- scroll -->
  <g filter="url(#shadow)">
    <path d="M62 50 H194 V206 H62 Z" fill="url(#paper)"/>
    <!-- writing -->
    <g stroke="#a3824f" stroke-width="4" stroke-linecap="round" opacity="0.55">
      <path d="M82 80 H174"/>
      <path d="M82 96 H166"/>
      <path d="M82 112 H172"/>
      <path d="M82 128 H124"/>
      <path d="M82 144 H118"/>
    </g>
    <!-- top roll -->
    <rect x="44" y="34" width="168" height="30" rx="15" fill="url(#roll)"/>
    <circle cx="59" cy="49" r="11" fill="#c9a061"/>
    <path d="M59 43 a6 6 0 1 1 -6 6 a3.5 3.5 0 1 1 3.5 -3.5" fill="none" stroke="#8a6230" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="197" cy="49" r="11" fill="#c9a061"/>
    <path d="M197 43 a6 6 0 1 0 6 6 a3.5 3.5 0 1 0 -3.5 -3.5" fill="none" stroke="#8a6230" stroke-width="2.2" stroke-linecap="round"/>
    <!-- bottom roll -->
    <rect x="44" y="192" width="168" height="30" rx="15" fill="url(#roll)"/>
    <circle cx="59" cy="207" r="11" fill="#c9a061"/>
    <path d="M59 201 a6 6 0 1 1 -6 6 a3.5 3.5 0 1 1 3.5 -3.5" fill="none" stroke="#8a6230" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="197" cy="207" r="11" fill="#c9a061"/>
    <path d="M197 201 a6 6 0 1 0 6 6 a3.5 3.5 0 1 0 -3.5 -3.5" fill="none" stroke="#8a6230" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- ribbon tails -->
  <g filter="url(#shadow)">
    <path d="M150 186 L136 238 L146 232 L152 242 L164 192 Z" fill="url(#ribbon)"/>
    <path d="M180 186 L196 236 L186 231 L181 241 L168 192 Z" fill="url(#ribbon)"/>
  </g>

