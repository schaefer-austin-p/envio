name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# A newer push to a PR cancels that PR's older run. Runs outside a PR (pushes
# to master, tags) each get a group of their own, so they run side by side
# instead of cancelling each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # No debuginfo in CI builds: nothing reads it, and it is most of target/.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # sccache can't cache incremental compilations.
  CARGO_INCREMENTAL: "0"
  SCCACHE_CACHE_SIZE: "2G"
  # Snapshot tests (insta) fail on a new or changed snapshot, never write it.
  INSTA_UPDATE: "no"

jobs:
  # The Qt-free workspace. On a PR, unit and single-crate integration tests
  # run only for the crates the PR changed plus their dependents (cargo
  # xtask affected); fmt, clippy and the cross-crate tests always run.
  # On master and tags everything runs.
  rust:
    runs-on: rust-ci
    steps:
      # Full history: affected diffs against the merge base with master.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Caches: every run restores, only pushes to master save (the Save steps
      # at the end of each job). Keys hash lockfiles, Cargo.toml and this file,
      # so a PR changing one would otherwise save its own multi-GB entry;
      # PRs get a warm cache through restore-keys instead.
      # CARGO_HOME is /usr/local/cargo in the rust image, not ~/.cargo
      - name: Cache cargo registry
        id: c_reg
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache sccache compilation objects
        id: c_sccache
        uses: actions/cache/restore@v4
        with:
          path: /root/.cache/sccache
          key: sccache-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.forgejo/workflows/ci.yml') }}
          restore-keys: |
            sccache-

      - name: Format check
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Pick crates to test
        id: pick
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            args=$(cargo xtask affected --base "origin/$BASE")
          else
            args="--workspace --exclude envio-e2e"
          fi
          echo "args=$args" >>"$GITHUB_OUTPUT"
          echo "Testing: ${args:-no crates changed}"

      # Always: the cross-crate step below runs on every PR and needs it
      # (one start serves envio-net's tests and envio-e2e's).
      - name: Start Stalwart (envio-net integration tests, envio-e2e sync tests)
        id: stalwart
        run: tools/ci/stalwart.sh

      - name: Unit and crate integration tests (changed crates)
        if: steps.pick.outputs.args != ''
        run: cargo llvm-cov ${{ steps.pick.outputs.args }} --locked --summary-only

      - name: Cross-crate tests
        run: cargo test -p envio-e2e --locked

      - name: Stop Stalwart
        if: always() && steps.stalwart.outcome != 'skipped'
        run: docker rm -f "$STALWART_NAME" || true

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Save cargo registry cache (master only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.c_reg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
          key: ${{ steps.c_reg.outputs.cache-primary-key }}

      - name: Save sccache objects (master only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.c_sccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /root/.cache/sccache
          key: ${{ steps.c_sccache.outputs.cache-primary-key }}

  # The Qt side in the ut-app-ci image: translations, qt/ fmt and clippy,
  # qmllint, the -Werror CMake build and the QML tests. Always runs.
  # After `rust`: the runner takes two jobs at once, and this image's
  # multi-GB pull slows a build it shares the box with.
  app:
    needs: rust
    runs-on: docker
    container:
      image: code.austinschaefer.com/schaefera/ut-app-ci:24.04-2.x-1
    env:
      FETCHCONTENT_BASE_DIR: /root/.cache/envio-fetchcontent
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      # CARGO_HOME is /opt/rust/cargo in the clickable image.
      - name: Cache cargo registry and CMake FetchContent
        id: c_deps
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/rust/cargo/registry/index
            /opt/rust/cargo/registry/cache
            /root/.cache/envio-fetchcontent
          key: app-deps-${{ hashFiles('qt/Cargo.lock', 'CMakeLists.txt') }}
          restore-keys: |
            app-deps-

      - name: Cache app build output
        id: c_build
        uses: actions/cache/restore@v4
        with:
          path: |
            target/ci-qt
            build-ci
          key: app-build-v1-24.04-2.x-1-${{ hashFiles('qt/Cargo.lock', 'qt/Cargo.toml', 'crates/*/Cargo.toml', 'qt/build.rs', 'qt/stamp/Cargo.toml', 'qt/stamp/build.rs', 'CMakeLists.txt') }}
          restore-keys: |
            app-build-v1-24.04-2.x-1-

      - name: App checks
        run: tools/ci/app.sh

      - name: Save cargo registry and FetchContent cache (master only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.c_deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/rust/cargo/registry/index
            /opt/rust/cargo/registry/cache
            /root/.cache/envio-fetchcontent
          key: ${{ steps.c_deps.outputs.cache-primary-key }}

      - name: Save app build cache (master only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.c_build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/ci-qt
            build-ci
          key: ${{ steps.c_build.outputs.cache-primary-key }}

  audit:
    needs: rust
    runs-on: rust-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: cargo audit
        run: |
          cargo audit
          cargo audit --file qt/Cargo.lock

      - name: CI script tests
        run: node --test tools/ci/advisory-issue.test.mjs tools/ci/release-click.test.mjs
