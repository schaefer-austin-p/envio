name: Click

# The arm64 .click package. Not a required check: on a PR it runs only when
# something that goes into the package changes.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - clickable.yaml
      - manifest.json
      - envio.desktop
      - envio.url-dispatcher
      - "assets/**"
      - envio.apparmor
      - CMakeLists.txt
      - "qt/**"
      - ".forgejo/workflows/**"
      - tools/ci/click.sh
      - tools/stamp.sh
      - tools/ci/dind.sh

concurrency:
  group: click-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  click:
    runs-on: docker
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A v* tag needs its CHANGELOG section in the tagged commit (a re-run
      # sees the same tree), so check that before the long build.
      - name: Check the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/ci/release-click.mjs --check

      # Builds in clickable's image on the runner's dind daemon, then runs
      # click-review (errors fail, warnings print).
      - name: Build and review the click
        run: tools/ci/click.sh

      - uses: actions/upload-artifact@v3
        with:
          name: envio-click
          path: build-click/*.click
          retention-days: 30

      # A v* tag build is the official package: put it on the tag's release,
      # creating the release from the CHANGELOG if it isn't there yet.
      - name: Attach the click to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/ci/release-click.mjs build-click/*.click
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also after a failed build or review, so the report is still there.
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: envio-click-review
          path: build-click/click-review.txt
          if-no-files-found: ignore
          retention-days: 30
